<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <g transform="translate(100,75)">
    <circle cx="0" cy="0" r="30" fill="#EC4899" opacity="0.2">
      <animate attributeName="r" values="26;34;26" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="10" font-size="56" text-anchor="middle">
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="1s" repeatCount="indefinite"/>
      🎉
    </text>
  </g>
</svg>
