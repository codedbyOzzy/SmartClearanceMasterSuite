<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <g transform="translate(100,75)">
    <circle cx="0" cy="0" r="42" fill="#F59E0B" opacity="0.2">
      <animate attributeName="r" values="24;32;24" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="10" font-size="56" text-anchor="middle">
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="0.8s" repeatCount="indefinite"/>
      👏
    </text>
    <circle cx="-25" cy="-20" r="3" fill="#EC4899">
      <animate attributeName="cy" values="-20;-30;-20" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="-20" r="3" fill="#3B82F6">
      <animate attributeName="cy" values="-20;-32;-20" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-28" r="3" fill="#10B981">
      <animate attributeName="cy" values="-28;-36;-28" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
