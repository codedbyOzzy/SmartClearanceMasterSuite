<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · SmartClearance Web Ops</title>
  <link rel="stylesheet" href="/static/hub.css?v={{ static_v }}" />
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">SmartClearance</div>
      <div class="brand-sub">Web Ops Hub · yerel</div>
      <nav class="nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Giriş</a>
        <a href="/kokpit" class="{% if request.url.path.startswith('/kokpit') %}active{% endif %}">Operasyon Kokpiti</a>
        <a href="/gtb-takip" class="{% if request.url.path.startswith('/gtb-takip') %}active{% endif %}">GTB Beyanname Takip</a>
        <a href="/kantar-takip" class="{% if request.url.path.startswith('/kantar-takip') %}active{% endif %}">Kantar DBA Takip</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
